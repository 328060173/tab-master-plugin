<!DOCTYPE html>
<html>
  <head>
    <title>TM-浏览器标签整理大师</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <style>
      /* ===== 首屏 Loading（纯 HTML+CSS，无 inline script，守 MV3 CSP）=====
       * HTML 解析后即显示 spinner + 品牌底色，消除纯白屏；Vue mount 后 sidepanel.vue
       * onMounted 加 body.app-ready class，CSS display:none 隐藏 loading（不删 DOM，出错仍可见）。
       * 注意：
       *   - 不能用 body::before 做 spinner（skin-overlay.css 已用 body::before 显示主题背景图，会冲突）
       *   - 不能用 inline <script>（MV3 CSP 禁止 inline script）——超时兜底不在此做
       *   - Chrome sidepanel 容器激活到 HTML 解析之间的白屏 CSS 无法消除（CSS 也在 HTML 里）
       *   - app-ready 后 body 透明，让 sidepanel.vue 的 body 背景 + skin-overlay 主题背景图透出
       */
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      /* loading 阶段（未 app-ready）品牌底色；app-ready 后透明让主题背景图透出 */
      body:not(.app-ready) {
        background-color: #f8fafc;
      }
      html.dark body:not(.app-ready) {
        background-color: #1f2937;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 0;
        background-color: transparent;
        color: #2563eb;
      }
      html.dark #app-loading {
        color: #93c5fd;
      }
      #app-loading .sp-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: sp-spin 0.8s linear infinite;
      }
      html.dark #app-loading .sp-spinner {
        border-color: #374151;
        border-top-color: #93c5fd;
      }
      #app-loading .sp-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      #app-loading .sp-sub {
        font-size: 12px;
        color: #9ca3af;
      }
      /* Vue mount 后加 app-ready class 隐藏 loading（不删 DOM，Vue 出错 loading 仍可见） */
      body.app-ready #app-loading {
        display: none;
      }
      @keyframes sp-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .sp-spinner { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="app-loading" aria-busy="true" aria-live="polite">
      <div class="sp-spinner" aria-hidden="true"></div>
      <div class="sp-title">浏览器标签大师</div>
      <div class="sp-sub">正在加载…</div>
    </div>
  </body>
</html>
