<!DOCTYPE html>
<html>
  <head>
    <title>TM-浏览器标签整理大师</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <style>
      /* ===== 首屏 Loading（MV3 sidepanel 白屏治理，2026-07-30）=====
       * 问题：Chrome sidepanel 容器首次激活 → HTML 解析 → JS bundle → Vue mount，
       *   HTML 解析前是 Chrome 自身白屏（#app-loading div 还没渲染）。二次打开 JS 缓存快但仍有一瞬白。
       * 解法（大模型方案 C）：
       *   1. html/body 直接设背景色——消除纯白，至少品牌底色（CSS 在 head，HTML 一解析 body 就上色）
       *   2. body::before 伪元素 spinner——CSS 一解析就显示，不依赖 body 内 div 渲染
       *   3. body.app-ready 时隐藏 loading（Vue mount 后加 class，不删 DOM，出错仍可见）
       *   4. 超时兜底：JS 5s 没加 app-ready，显示「加载超时，点击刷新」
       * 注意：Chrome 容器激活到 HTML 解析之间的白屏无法用 CSS 消除（CSS 也在 HTML 里），
       *   本方案只覆盖 HTML 解析后到 Vue mount 前的阶段。
       */
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background-color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      html.dark, html.dark body {
        background-color: #1f2937;
      }
      /* 伪元素 loading：CSS 解析即显示，早于 body 内 div */
      body::before {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        width: 32px;
        height: 32px;
        margin: -16px 0 0 -16px;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: sp-spin 0.8s linear infinite;
        z-index: 999999;
      }
      html.dark body::before {
        border-color: #374151;
        border-top-color: #93c5fd;
      }
      /* #app-loading 文字层（HTML div，补充 spinner 下方的文字） */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        margin: 0;
        background-color: transparent;
        color: #2563eb;
      }
      html.dark #app-loading {
        color: #93c5fd;
      }
      #app-loading .sp-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      #app-loading .sp-sub {
        font-size: 12px;
        color: #9ca3af;
      }
      /* Vue mount 后加 app-ready class，隐藏 loading（伪元素 + div 一起） */
      body.app-ready::before,
      body.app-ready #app-loading {
        display: none;
      }
      /* 超时兜底：5s 没加 app-ready，显示刷新提示（JS 挂了也能看到） */
      body.timeout #app-loading .sp-sub::after {
        content: "（加载超时，点击刷新页面）";
        display: block;
        margin-top: 8px;
        color: #ef4444;
      }
      @keyframes sp-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        body::before { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="app-loading" aria-busy="true" aria-live="polite">
      <div class="sp-title">浏览器标签大师</div>
      <div class="sp-sub">正在加载…</div>
    </div>
    <!-- 超时兜底：5s 后 JS 没加 app-ready 则显示刷新提示（纯 HTML+JS 内联，不依赖 Vue） -->
    <script>
      setTimeout(function () {
        if (!document.body.classList.contains('app-ready')) {
          document.body.classList.add('timeout');
        }
      }, 5000);
    </script>
  </body>
</html>
